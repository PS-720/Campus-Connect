server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: campusconnect-backend

  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/campusconnect}
      auto-index-creation: true

  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:25MB}
      max-request-size: ${MAX_REQUEST_SIZE:30MB}

# Security & JWT Configuration
app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# Logging configuration
logging:
  level:
    root: INFO
    com.campusconnect: DEBUG
    org.springframework.data.mongodb.core.MongoTemplate: DEBUG
